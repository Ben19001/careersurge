name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Builds the UI once; the backend jobs download it, because the end-to-end UI tests skip without dist.
  frontend:
    # The private repo this is exported from tracks the file too; it runs only in the public repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    needs: frontend
    # The private repo this is exported from tracks the file too; it runs only in the public repo.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests
        env:
          # A scratch data dir, so a test that forgets to set its own still stays off the runner's home.
          # (`runner` is readable in step env, not job env.)
          CAREERSURGE_DATA_DIR: ${{ runner.temp }}/careersurge-data

  # The README's one-line install, from a clean checkout. `--help` reaches the app after the install: it imports the
  # server modules, prints its usage and exits 0 without starting a server, opening a window or touching data. Then the
  # built UI and the install marker must exist.
  quickstart:
    # The private repo this is exported from tracks the file too; it runs only in the public repo.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # /bin/bash is macOS's own bash 3.2, which run.sh must support.
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash ./run.sh --help
          test -f frontend/dist/index.html
          test -f backend/venv/.installed
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File run.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path frontend\dist\index.html) -or -not (Test-Path backend\venv\.installed)) { exit 1 }

  gitleaks:
    # The private repo this is exported from tracks the file too; it runs only in the public repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
